name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Advisory: reporta vulnerabilidades mas NÃO bloqueia o PR.
      # Motivo: há vulnerabilidade high sem correção disponível (ex.: xlsx),
      # que tornaria um audit bloqueante permanentemente vermelho.
      # Revisar o relatório manualmente; endurecer para bloqueante quando o baseline estiver limpo.
      - name: Audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
